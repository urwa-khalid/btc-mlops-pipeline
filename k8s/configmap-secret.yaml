apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  labels:
    app: btc-forecast
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
  labels:
    app: btc-forecast
type: Opaque
stringData:
  # Placeholder values for the assignment; real secrets never belong in git.
  RELOAD_TOKEN: "change-me"
  API_KEY: "demo-api-key"
