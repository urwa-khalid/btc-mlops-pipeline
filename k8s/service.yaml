# Internal service (used by the Ingress)
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-svc
  labels:
    app: btc-forecast
spec:
  type: ClusterIP
  selector:
    app: btc-forecast
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
# External access without the Ingress: http://<node-ip>:30080
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-nodeport
  labels:
    app: btc-forecast
spec:
  type: NodePort
  selector:
    app: btc-forecast
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
